name: Codex review loop

on:
  pull_request:
    types: [synchronize]
  pull_request_review:
    types: [submitted]

env:
  MAX_CODEX_REVISIONS: '3'
  HUMAN_REVIEWER: kasittig

jobs:
  carry-revision-state:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.sender.type == 'Bot' &&
      (contains(github.event.sender.login, 'codex') ||
       contains(github.event.sender.login, 'chatgpt'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Bind the revision count to the new head
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;
            const beforeSha = context.payload.before;
            const requestMarker = new RegExp(
              `<!-- codex-review-loop:request:revision:(\\d+):head:${beforeSha} -->`,
            );
            const conversation = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            );
            const request = conversation.findLast(
              (comment) =>
                comment.user?.login === 'github-actions[bot]' &&
                requestMarker.test(comment.body ?? ''),
            );
            const revision = request?.body?.match(requestMarker)?.[1];
            if (!revision) {
              core.warning('Codex pushed without a workflow-authored revision request.');
              return;
            }
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `<!-- codex-review-loop:state:revision:${revision}:head:${headSha} -->`,
            });

  coordinate:
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.pull_request.draft == false &&
      github.event.review.user.type == 'Bot' &&
      (contains(github.event.review.user.login, 'codex') ||
       contains(github.event.review.user.login, 'chatgpt'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Continue revisions or hand off to a human
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;
            const maxRevisions = Number(process.env.MAX_CODEX_REVISIONS);
            const humanReviewer = process.env.HUMAN_REVIEWER;
            const headSha = context.payload.pull_request.head.sha;

            if (context.payload.review.commit_id !== headSha) {
              core.info('Ignoring a review for a stale PR head.');
              return;
            }

            const conversation = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            );
            const stateMarker = new RegExp(
              `<!-- codex-review-loop:state:revision:(\\d+):head:${headSha} -->`,
            );
            const revisions = Number(
              conversation.findLast(
                (comment) =>
                  comment.user?.login === 'github-actions[bot]' &&
                  stateMarker.test(comment.body ?? ''),
              )?.body?.match(stateMarker)?.[1] ?? 0,
            );
            const verdictMatch = context.payload.review.body?.match(
              /<!-- codex-review-verdict: (\{[^\n]+\}) -->/,
            );
            let verdict;
            try {
              verdict = verdictMatch && JSON.parse(verdictMatch[1]);
            } catch (error) {
              core.warning(`Codex returned an invalid review verdict: ${error.message}`);
            }
            const cleanVerdict =
              verdict?.actionable === false &&
              verdict.highest_severity === null &&
              verdict.finding_count === 0;
            const actionableVerdict =
              verdict?.actionable === true &&
              ['P0', 'P1'].includes(verdict.highest_severity) &&
              Number.isInteger(verdict.finding_count) &&
              verdict.finding_count > 0;

            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            };

            const replaceHandoffLabel = async (add, remove) => {
              await ensureLabel(...add);
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [add[0]] });
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: remove });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            };

            if (cleanVerdict) {
              await replaceHandoffLabel(
                ['human-review-ready', '2da44e', 'Codex review is clear; ready for human review'],
                'human-review-needed',
              );
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: `@${humanReviewer} Codex found no blocking issues in its latest review. This PR is ready for your manual review.`,
              });
              return;
            }

            if (!actionableVerdict) {
              await replaceHandoffLabel(
                ['human-review-needed', 'd93f0b', 'Codex review verdict missing or invalid'],
                'human-review-ready',
              );
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: `@${humanReviewer} Codex did not return a valid machine-readable verdict for ${headSha.slice(0, 7)}. The automation stopped for manual review.`,
              });
              return;
            }

            if (revisions >= maxRevisions) {
              await replaceHandoffLabel(
                ['human-review-needed', 'd93f0b', 'Codex revision cap reached; human attention needed'],
                'human-review-ready',
              );
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: `@${humanReviewer} Codex still has ${verdict.finding_count} actionable finding(s) after ${maxRevisions} revision rounds. The automation stopped here for manual review.`,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `<!-- codex-review-loop:request:revision:${revisions + 1}:head:${headSha} -->\n@codex fix all actionable findings from your latest review. Keep the changes scoped, run the relevant tests, and push the fixes to this PR branch. Revision ${revisions + 1} of ${maxRevisions}.`,
            });
