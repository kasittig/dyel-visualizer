name: Codex review loop

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

env:
  MAX_CODEX_REVISIONS: '3'
  HUMAN_REVIEWER: kasittig

concurrency:
  group: codex-review-loop-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  coordinate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      # This trusted-base workflow must never check out or execute pull-request-controlled content.
      - name: Continue revisions or hand off to a human
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;
            const maxRevisions = Number(process.env.MAX_CODEX_REVISIONS);
            const humanReviewer = process.env.HUMAN_REVIEWER;
            const headSha = context.payload.pull_request.head.sha;
            const beforeSha = context.payload.before;
            const conversation = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            );

            let revisions = 0;
            if (
              context.payload.action === 'synchronize' &&
              context.payload.sender.type === 'Bot' &&
              (context.payload.sender.login.includes('codex') ||
                context.payload.sender.login.includes('chatgpt'))
            ) {
              const previousMarker = new RegExp(
                `<!-- codex-review-loop:(?:request|state):revision:(\\d+):head:${beforeSha} -->`,
              );
              revisions = Number(
                conversation.findLast(
                  (comment) =>
                    comment.user?.login === 'github-actions[bot]' &&
                    previousMarker.test(comment.body ?? ''),
                )?.body?.match(previousMarker)?.[1] ?? 0,
              );
              const stateMarker =
                `<!-- codex-review-loop:state:revision:${revisions}:head:${headSha} -->`;
              if (
                revisions > 0 &&
                !conversation.some(
                  (comment) =>
                    comment.user?.login === 'github-actions[bot]' &&
                    comment.body?.includes(stateMarker),
                )
              ) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body: stateMarker,
                });
              }
            }

            let review;
            for (let attempt = 0; attempt < 60; attempt += 1) {
              const { data: pull } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: issue_number,
              });
              if (pull.head.sha !== headSha) {
                core.info('A newer PR head superseded this run.');
                return;
              }
              const reviews = await github.paginate(
                github.rest.pulls.listReviews,
                { owner, repo, pull_number: issue_number, per_page: 100 },
              );
              review = reviews.findLast(
                (candidate) =>
                  candidate.commit_id === headSha &&
                  candidate.user?.type === 'Bot' &&
                  (candidate.user.login.includes('codex') ||
                    candidate.user.login.includes('chatgpt')),
              );
              if (review) break;
              await new Promise((resolve) => setTimeout(resolve, 30_000));
            }

            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            };

            const replaceHandoffLabel = async (add, remove) => {
              await ensureLabel(...add);
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [add[0]] });
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: remove });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            };

            if (!review) {
              await replaceHandoffLabel(
                ['human-review-needed', 'd93f0b', 'Codex review timed out; human attention needed'],
                'human-review-ready',
              );
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: `@${humanReviewer} Codex did not finish reviewing ${headSha.slice(0, 7)} within 30 minutes. The automation stopped for manual review.`,
              });
              return;
            }

            const verdictMatch = review.body?.match(
              /<!-- codex-review-verdict: (\{[^\n]+\}) -->/,
            );
            let verdict;
            try {
              verdict = verdictMatch && JSON.parse(verdictMatch[1]);
            } catch (error) {
              core.warning(`Codex returned an invalid review verdict: ${error.message}`);
            }
            const cleanVerdict =
              verdict?.actionable === false &&
              verdict.highest_severity === null &&
              verdict.finding_count === 0;
            const actionableVerdict =
              verdict?.actionable === true &&
              ['P0', 'P1'].includes(verdict.highest_severity) &&
              Number.isInteger(verdict.finding_count) &&
              verdict.finding_count > 0;

            if (cleanVerdict) {
              await replaceHandoffLabel(
                ['human-review-ready', '2da44e', 'Codex review is clear; ready for human review'],
                'human-review-needed',
              );
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: `@${humanReviewer} Codex found no blocking issues in its latest review. This PR is ready for your manual review.`,
              });
              return;
            }

            if (!actionableVerdict) {
              await replaceHandoffLabel(
                ['human-review-needed', 'd93f0b', 'Codex review verdict missing or invalid'],
                'human-review-ready',
              );
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: `@${humanReviewer} Codex did not return a valid machine-readable verdict for ${headSha.slice(0, 7)}. The automation stopped for manual review.`,
              });
              return;
            }

            if (revisions >= maxRevisions) {
              await replaceHandoffLabel(
                ['human-review-needed', 'd93f0b', 'Codex revision cap reached; human attention needed'],
                'human-review-ready',
              );
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: `@${humanReviewer} Codex still has ${verdict.finding_count} actionable finding(s) after ${maxRevisions} revision rounds. The automation stopped here for manual review.`,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `<!-- codex-review-loop:request:revision:${revisions + 1}:head:${headSha} -->\n@codex fix all actionable findings from your latest review. Keep the changes scoped, run the relevant tests, and push the fixes to this PR branch. Revision ${revisions + 1} of ${maxRevisions}.`,
            });
